<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apprendo — Ingresar</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FAFAF8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 48px; height: 48px;
      background: #0A8F7E;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .logo-text { font-size: 28px; font-weight: 600; color: #0A8F7E; }
    .logo-sub { font-size: 13px; color: #888; margin-top: 2px; }
    .card {
      background: white;
      border-radius: 16px;
      border: 1px solid #E5E5E3;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h1 { font-size: 22px; font-weight: 600; color: #1A1A1A; margin-bottom: 6px; }
    p.sub { font-size: 14px; color: #888; margin-bottom: 24px; }
    label { display: block; font-size: 14px; font-weight: 500; color: #444; margin-bottom: 6px; }
    input {
      width: 100%; border: 1px solid #DDD; border-radius: 10px;
      padding: 12px 14px; font-size: 15px; margin-bottom: 16px;
      outline: none; transition: border-color .15s;
      font-family: inherit;
    }
    input:focus { border-color: #0A8F7E; box-shadow: 0 0 0 3px rgba(10,143,126,0.1); }
    button {
      width: 100%; background: #0A8F7E; color: white;
      border: none; border-radius: 10px; padding: 14px;
      font-size: 16px; font-weight: 500; cursor: pointer;
      font-family: inherit; transition: background .15s;
    }
    button:hover { background: #076D60; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      background: #FEF2F2; color: #C0392B; border-radius: 8px;
      padding: 10px 14px; font-size: 14px; margin-bottom: 16px;
      display: none;
    }
    .success {
      background: #E6F5F3; color: #0A8F7E; border-radius: 8px;
      padding: 10px 14px; font-size: 14px; margin-bottom: 16px;
      display: none;
    }
    .divider {
      text-align: center; color: #BBB; font-size: 13px;
      margin: 16px 0; position: relative;
    }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%;
      width: 42%; height: 1px; background: #EEE;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .btn-magic {
      background: white; color: #0A8F7E;
      border: 1.5px solid #0A8F7E;
    }
    .btn-magic:hover { background: #E6F5F3; }
    .footer { margin-top: 24px; font-size: 12px; color: #BBB; text-align: center; }
  </style>
</head>
<body>

<div class="logo">
  <div class="logo-icon">📚</div>
  <div>
    <div class="logo-text">Apprendo</div>
    <div class="logo-sub">Norma Costaganna</div>
  </div>
</div>

<div class="card">
  <h1>Bienvenida</h1>
  <p class="sub">Ingresá a tu cuenta</p>

  <div class="error" id="error"></div>
  <div class="success" id="success"></div>

  <label>Email</label>
  <input type="email" id="email" placeholder="tu@email.com" />

  <label>Contraseña</label>
  <input type="password" id="password" placeholder="••••••••" />

  <button id="btn-login" onclick="login()">Ingresar</button>

  <div class="divider">o</div>

  <button class="btn-magic" onclick="magicLink()">Recibir link por email</button>
</div>

<div class="footer">Clases particulares · Apprendo</div>

<script>
  const SUPABASE_URL = 'https://ivarjjotugjdsgapcrpt.supabase.co'
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2YXJqam90dWdqZHNnYXBjcnB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMDIyODUsImV4cCI6MjA5OTc3ODI4NX0.uK1wOrzJnYIxnTT_Jgirme5kPBa3IRE1frGze2vhuQA'
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

  // Si ya está logueado, redirigir
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) redirect(session.user.email)
  })

  function redirect(email) {
    if (email === 'normacostag@gmail.com') {
      window.location.href = 'teacher.html'
    } else {
      window.location.href = 'parent.html'
    }
  }

  function showError(msg) {
    const el = document.getElementById('error')
    el.textContent = msg
    el.style.display = 'block'
    document.getElementById('success').style.display = 'none'
  }

  function showSuccess(msg) {
    const el = document.getElementById('success')
    el.textContent = msg
    el.style.display = 'block'
    document.getElementById('error').style.display = 'none'
  }

  async function login() {
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value
    const btn = document.getElementById('btn-login')

    if (!email || !password) return showError('Completá email y contraseña.')

    btn.disabled = true
    btn.textContent = 'Ingresando...'

    const { data, error } = await supabase.auth.signInWithPassword({ email, password })

    if (error) {
      showError('Email o contraseña incorrectos.')
      btn.disabled = false
      btn.textContent = 'Ingresar'
      return
    }

    redirect(data.user.email)
  }

  async function magicLink() {
    const email = document.getElementById('email').value.trim()
    if (!email) return showError('Ingresá tu email primero.')

    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.origin + '/parent.html' }
    })

    if (error) return showError('Error al enviar el link. Intentá de nuevo.')
    showSuccess('¡Listo! Revisá tu email y hacé click en el link para entrar.')
  }

  // Enter para login
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') login()
  })
</script>

</body>
</html>
